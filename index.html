<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聖書トラッカー</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--green:#58CC02;--green-dk:#46A302;--green-lt:#D7FFB8;--blue:#1CB0F6;--blue-dk:#0099DA;--blue-lt:#DDF4FF;--yellow:#FFD900;--yellow-dk:#CE9700;--yellow-lt:#FFF8CC;--red:#FF4B4B;--red-lt:#FFDEDE;--gray:#AFAFAF;--gray-lt:#F7F7F7;--gray-dk:#777;--text:#3C3C3C;--white:#fff;--radius:16px;--radius-sm:8px;--radius-lg:24px;}
body{font-family:'Nunito',sans-serif;background:#F5F5F5;color:var(--text);min-height:100vh;}
.app{max-width:480px;margin:0 auto;padding:0 0 80px;}
.topbar{background:var(--white);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #E5E5E5;position:sticky;top:0;z-index:50;}
.topbar-stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px;}
.topbar-stat .icon{font-size:20px;}
.streak-count{color:#FF9600;}.xp-count{color:var(--blue);}.gem-count{color:var(--green);}
.hero{background:linear-gradient(135deg,#58CC02 0%,#1CB0F6 100%);padding:28px 20px 36px;color:white;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;background:rgba(255,255,255,.1);border-radius:50%;}
.hero::after{content:'';position:absolute;bottom:-30px;left:-30px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%;}
.hero-name{font-size:13px;font-weight:700;opacity:.85;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em;}
.hero-level{font-size:28px;font-weight:900;margin-bottom:12px;}
.hero-xp-bar{background:rgba(255,255,255,.25);border-radius:99px;height:10px;margin-bottom:6px;}
.hero-xp-fill{background:white;border-radius:99px;height:10px;transition:width .6s;}
.hero-xp-label{font-size:12px;font-weight:700;opacity:.85;}
.streak-section{padding:16px 16px 0;}
.streak-card{background:var(--white);border-radius:var(--radius);padding:16px;border:2px solid #E5E5E5;display:flex;align-items:center;gap:14px;}
.streak-fire{font-size:42px;line-height:1;}
.streak-info{flex:1;}
.streak-num{font-size:28px;font-weight:900;color:#FF9600;line-height:1;}
.streak-label{font-size:13px;color:var(--gray-dk);font-weight:600;}
.streak-days{display:flex;gap:6px;margin-top:8px;}
.streak-day{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.streak-day.done{background:#FF9600;color:white;}
.streak-day.today{background:var(--yellow-lt);border:2px solid var(--yellow);color:var(--yellow-dk);}
.streak-day.miss{background:var(--gray-lt);color:var(--gray);}
.section{padding:16px 16px 0;}
.section-title{font-size:13px;font-weight:800;color:var(--gray-dk);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--white);border-radius:var(--radius);padding:14px;border:2px solid #E5E5E5;text-align:center;}
.stat-val{font-size:24px;font-weight:900;}
.stat-lab{font-size:12px;color:var(--gray-dk);font-weight:700;margin-top:2px;}
.stat-card.green .stat-val{color:var(--green-dk);}.stat-card.blue .stat-val{color:var(--blue-dk);}
.books-section{padding:16px;}
.testament-label{font-size:13px;font-weight:800;color:var(--gray-dk);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 8px;padding:0 2px;}
.books-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.book-tile{background:var(--white);border-radius:var(--radius-sm);padding:8px 4px;border:2.5px solid #E5E5E5;cursor:pointer;transition:all .15s;text-align:center;position:relative;}
.book-tile:hover{transform:translateY(-2px);border-color:var(--green);}
.book-tile.complete{background:var(--green-lt);border-color:var(--green);}
.book-tile.inprog{border-color:var(--blue);}
.book-name{font-size:9.5px;font-weight:800;color:var(--text);line-height:1.2;margin-bottom:4px;}
.book-pct{font-size:10px;font-weight:700;color:var(--gray);}
.book-tile.complete .book-pct{color:var(--green-dk);}.book-tile.inprog .book-pct{color:var(--blue-dk);}
.book-prog{height:3px;background:#E5E5E5;border-radius:99px;overflow:hidden;margin-top:3px;}
.book-prog-fill{height:3px;border-radius:99px;background:var(--green);transition:width .3s;}
.book-tile.inprog .book-prog-fill{background:var(--blue);}
.check-badge{position:absolute;top:-6px;right:-6px;width:18px;height:18px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:white;border:2px solid white;}
.badges-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
.badges-row::-webkit-scrollbar{display:none;}
.badge-card{background:var(--white);border-radius:var(--radius);padding:14px 12px;border:2px solid #E5E5E5;min-width:90px;text-align:center;flex-shrink:0;}
.badge-card.earned{border-color:var(--yellow);background:var(--yellow-lt);}
.badge-icon{font-size:28px;margin-bottom:4px;}
.badge-name{font-size:10px;font-weight:800;color:var(--text);line-height:1.2;}
.badge-card:not(.earned){filter:grayscale(.8);opacity:.6;}
.rank-list{display:flex;flex-direction:column;gap:8px;}
.rank-row{background:var(--white);border-radius:var(--radius-sm);padding:12px 14px;border:2px solid #E5E5E5;display:flex;align-items:center;gap:12px;}
.rank-row.me{border-color:var(--blue);background:var(--blue-lt);}
.rank-pos{font-size:16px;font-weight:900;width:28px;text-align:center;color:var(--gray);}
.rank-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;}
.rank-info{flex:1;min-width:0;}
.rank-name{font-size:14px;font-weight:800;color:var(--text);}
.rank-xp{font-size:12px;color:var(--gray-dk);font-weight:700;}
.rank-xp-bar{height:4px;background:#E5E5E5;border-radius:99px;overflow:hidden;margin-top:4px;}
.rank-xp-fill{height:4px;border-radius:99px;background:var(--green);}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--white);border-top:2px solid #E5E5E5;display:flex;z-index:100;}
.nav-btn{flex:1;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:none;background:transparent;font-family:'Nunito',sans-serif;}
.nav-icon{font-size:22px;}.nav-label{font-size:10px;font-weight:800;color:var(--gray);}
.nav-btn.active .nav-label{color:var(--green-dk);}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--white);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:20px 16px 32px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;}
.modal-handle{width:40px;height:4px;background:#E5E5E5;border-radius:99px;margin:0 auto 16px;}
.modal-title{font-size:18px;font-weight:900;margin-bottom:8px;}
.chap-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.chap-btn{padding:10px 0;font-size:13px;font-weight:800;border-radius:var(--radius-sm);border:2.5px solid #E5E5E5;background:var(--white);cursor:pointer;transition:all .1s;color:var(--text);font-family:'Nunito',sans-serif;}
.chap-btn.read{background:var(--green);border-color:var(--green-dk);color:white;}
.chap-btn:hover{border-color:var(--green);}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.btn{padding:12px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:800;border:none;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .15s;}
.btn.primary{background:var(--green);color:white;border-bottom:4px solid var(--green-dk);}
.btn.ghost{background:var(--gray-lt);color:var(--gray-dk);}
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:300;display:flex;align-items:center;justify-content:center;}
.celebrate-bubble{background:var(--white);border-radius:var(--radius-lg);padding:28px 32px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.15);transform:scale(0);transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.celebrate-bubble.show{transform:scale(1);}
.celebrate-icon{font-size:56px;margin-bottom:8px;}
.celebrate-title{font-size:22px;font-weight:900;color:var(--text);}
.celebrate-sub{font-size:14px;color:var(--gray-dk);font-weight:600;margin-top:4px;}
.confetti{position:absolute;width:10px;height:10px;border-radius:2px;animation:fall 1.5s ease-in forwards;}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}
.login-screen{padding:32px 20px;min-height:100vh;display:flex;flex-direction:column;}
.login-hero{text-align:center;padding:32px 0 28px;}
.login-logo{font-size:64px;margin-bottom:12px;}
.login-title{font-size:28px;font-weight:900;color:var(--green-dk);}
.login-sub{font-size:15px;color:var(--gray-dk);font-weight:600;margin-top:6px;}
.input-wrap{margin-bottom:14px;}
.input-wrap label{display:block;font-size:13px;font-weight:800;color:var(--gray-dk);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
.input-wrap input{width:100%;padding:14px 16px;font-size:16px;font-weight:700;border:2.5px solid #E5E5E5;border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;color:var(--text);}
.input-wrap input:focus{outline:none;border-color:var(--blue);}
.big-btn{width:100%;padding:16px;background:var(--green);color:white;border:none;border-bottom:4px solid var(--green-dk);border-radius:var(--radius-sm);font-size:16px;font-weight:900;cursor:pointer;font-family:'Nunito',sans-serif;margin-top:4px;}
.big-btn:disabled{opacity:.6;cursor:not-allowed;}
.alert-box{padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;margin-bottom:12px;background:var(--red-lt);color:var(--red);display:none;}
.pane{display:none;}.pane.active{display:block;}
</style>
</head>

function $(id){return document.getElementById(id);}
function makeCode(){return Math.random().toString(36).slice(2,8).toUpperCase();}
function makeStableId(n,c){var s=n+"_"+c,h=0,t=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h=h|0;t+=s.charCodeAt(i);}return Math.abs(h).toString(36)+"x"+t.toString(36);}
function colorIdx(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%6;return h;}
function calcLevel(xp){return Math.floor((xp||0)/100)+1;}
function xpInLevel(xp){return(xp||0)%100;}
function todayStr(){return new Date().toISOString().slice(0,10);}
function totalRead(s){return BOOKS.reduce(function(a,b){return a+((s.read||{})[b.n]||[]).filter(Boolean).length;},0);}
function bookRead(s,b){return((s.read||{})[b.n]||[]).filter(Boolean).length;}
function showLoginAlert(msg){var el=$("login-alert");el.textContent=msg;el.style.display="block";}
function saveLocal(){try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}}
function loadLocal(){try{var s=JSON.parse(localStorage.getItem(SK)||"null");if(s&&s.name){state=s;return true;}}catch(e){}return false;}
async function saveToDb(){if(!sb)return;try{await sb.from("members").upsert([{id:state.id,group_code:state.code,name:state.name,read_data:{read:state.read,xp:state.xp,streak:state.streak,lastDate:state.lastDate,todayChaps:state.todayChaps,todayXp:state.todayXp,badges:state.badges},updated_at:new Date().toISOString()}]);}catch(e){console.error("DB save",e);}}

function updateStreak(){var today=todayStr();if(state.lastDate!==today){var prev=new Date();prev.setDate(prev.getDate()-1);var yesterday=prev.toISOString().slice(0,10);if(state.lastDate&&state.lastDate!==yesterday&&state.lastDate!==today){state.streak=0;}state.todayChaps=0;state.todayXp=0;}}
async function doLogin(){
  var name=$("inp-name").value.trim(),code=$("inp-code").value.trim().toUpperCase();
  if(!name){showLoginAlert("\u540d\u524d\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044");return;}
  if(code&&code.length!==6){showLoginAlert("\u30b0\u30eb\u30fc\u30d7\u30b3\u30fc\u30c9\u306f6\u6587\u5b57\u3067\u3059");return;}
  var btn=$("login-btn");btn.disabled=true;btn.textContent="\u63a5\u7d9a\u4e2d...";
  try{
    if(code){var gr=await sb.from("groups").select("code").eq("code",code);if(gr.error)throw new Error("DB\u30a8\u30e9\u30fc: "+gr.error.message);if(!gr.data||!gr.data.length){showLoginAlert("\u30b0\u30eb\u30fc\u30d7\u304c\u898b\u3064\u304b\u308a\u307e\u305b\u3093\u3002");btn.disabled=false;btn.textContent="\u306f\u3058\u3081\u308b\uff01 \uD83D\uDE80";return;}state.code=code;}
    else{state.code=makeCode();var cr=await sb.from("groups").insert([{code:state.code}]);if(cr.error)throw new Error("\u4f5c\u6210\u30a8\u30e9\u30fc: "+cr.error.message);}
    state.name=name;state.id=makeStableId(name,state.code);
    await loadFromDb();updateStreak();saveLocal();await saveToDb();enterApp();
  }catch(e){showLoginAlert("\u30a8\u30e9\u30fc: "+e.message);}
  btn.disabled=false;btn.textContent="\u306f\u3058\u3081\u308b\uff01 \uD83D\uDE80";
}
function enterApp(){$("login").style.display="none";$("main").style.display="block";$("group-code-disp").textContent=state.code;renderAll();}

function renderStreak(){$("streak-num").textContent=state.streak||0;var days=$("streak-days");days.innerHTML="";var dayNames=["\u6708","\u706b","\u6c34","\u6728","\u91d1","\u571f","\u65e5"];var today=new Date().getDay();var streak=state.streak||0;for(var i=0;i<7;i++){var d=document.createElement("div");var dayIdx=(today-6+i+7)%7;var cls="streak-day";if(i===6)cls+=" today";else if(streak>=7||(i>=7-streak&&i<6))cls+=" done";else cls+=" miss";d.className=cls;d.textContent=dayNames[dayIdx];days.appendChild(d);}}
function renderTodayStats(){$("today-chaps").textContent=state.todayChaps||0;$("today-xp").textContent="+"+(state.todayXp||0);}
function renderBadges(){var row=$("badges-row");row.innerHTML="";BADGES.forEach(function(b){var earned=(state.badges||{})[b.id]||b.check(state);var card=document.createElement("div");card.className="badge-card"+(earned?" earned":"");card.innerHTML="<div class='badge-icon'>"+b.icon+"</div><div class='badge-name'>"+b.name+"</div>";card.title=b.desc;row.appendChild(card);});}
function renderBooks(){["ot","nt"].forEach(function(t){var grid=$("grid-"+t);grid.innerHTML="";BOOKS.filter(function(b){return b.t===t;}).forEach(function(b){var rd=bookRead(state,b),pct=Math.round(rd/b.c*100);var done=rd===b.c,inprog=rd>0&&!done;var tile=document.createElement("div");tile.className="book-tile"+(done?" complete":inprog?" inprog":"");tile.innerHTML=(done?"<div class='check-badge'>\u2713</div>":"")+"<div class='book-name'>"+b.n+"</div><div class='book-pct'>"+(done?"\u5b8c\u4e86":rd+"/"+b.c)+"</div><div class='book-prog'><div class='book-prog-fill' style='width:"+pct+"%'></div></div>";tile.onclick=(function(bk){return function(){openModal(bk);};})(b);grid.appendChild(tile);});});}
async function renderRanking(){$("rank-loading").style.display="block";$("rank-list").innerHTML="";if(!sb){$("rank-loading").textContent="\u63a5\u7d9a\u30a8\u30e9\u30fc";return;}try{var res=await sb.from("members").select("id,name,read_data").eq("group_code",state.code);$("rank-loading").style.display="none";if(res.error||!res.data||!res.data.length){$("rank-list").innerHTML="<div style='color:var(--gray-dk);font-weight:700;font-size:14px;padding:12px 0;'>\u307e\u3060\u30e1\u30f3\u30d0\u30fc\u304c\u3044\u307e\u305b\u3093\u3002</div>";return;}var members=res.data.map(function(m){var d=m.read_data||{};return{id:m.id,name:m.name,xp:d.xp||0};});members.sort(function(a,b){return b.xp-a.xp;});var maxXp=members[0]?Math.max(members[0].xp,1):1;members.forEach(function(m,i){var ci=colorIdx(m.name);var pos=i+1;var posLabel=pos===1?"\uD83E\uDD47":pos===2?"\uD83E\uDD48":pos===3?"\uD83E\uDD49":pos;var row=document.createElement("div");row.className="rank-row"+(m.id===state.id?" me":"");row.innerHTML="<div class='rank-pos'>"+posLabel+"</div><div class='rank-avatar' style='background:"+BG[ci]+";color:"+TX[ci]+";'>"+m.name.slice(0,2)+"</div><div class='rank-info'><div class='rank-name'>"+m.name+(m.id===state.id?" <span style='font-size:11px;background:#DDF4FF;color:#0099DA;padding:1px 6px;border-radius:8px;font-weight:800;'>\u3042\u306a\u305f</span>":"")+"</div><div class='rank-xp'>"+m.xp+" XP \u30ec\u30d9\u30eb"+calcLevel(m.xp)+"</div><div class='rank-xp-bar'><div class='rank-xp-fill' style='width:"+Math.round(m.xp/maxXp*100)+"%'></div></div></div>";$("rank-list").appendChild(row);});}catch(e){$("rank-loading").textContent="\u30a8\u30e9\u30fc: "+e.message;}}
function showPane(p){["home","books","rank"].forEach(function(x){$("pane-"+x).classList.toggle("active",x===p);$("nav-"+x).classList.toggle("active",x===p);});if(p==="rank")renderRanking();}

function renderChaps(){var b=activeBook,g=$("chap-grid");g.innerHTML="";for(var i=1;i<=b.c;i++){var btn=document.createElement("button");var isRead=((state.read||{})[b.n]||[])[i-1];btn.className="chap-btn"+(isRead?" read":"");btn.textContent=i;btn.onclick=(function(bk,idx){return function(){toggleChap(bk,idx);};})(b,i-1);g.appendChild(btn);}}
async function toggleChap(b,i){if(!state.read)state.read={};if(!state.read[b.n])state.read[b.n]=new Array(b.c).fill(false);var wasRead=state.read[b.n][i];state.read[b.n][i]=!wasRead;var xpDelta=wasRead?-10:10;state.xp=Math.max(0,(state.xp||0)+xpDelta);if(!wasRead){state.todayChaps=(state.todayChaps||0)+1;state.todayXp=(state.todayXp||0)+10;var today=todayStr();if(state.lastDate!==today){var prev=new Date();prev.setDate(prev.getDate()-1);var yesterday=prev.toISOString().slice(0,10);state.streak=(state.lastDate===yesterday)?(state.streak||0)+1:1;state.lastDate=today;}}else{state.todayChaps=Math.max(0,(state.todayChaps||0)-1);state.todayXp=Math.max(0,(state.todayXp||0)-10);}saveLocal();renderChaps();renderAll();$("modal-info").textContent="\uD83D\uDCDB "+bookRead(state,b)+" / "+b.c+" \u7ae0\u3000\u2B50 1\u7ae0 = 10 XP";if(!wasRead&&bookRead(state,b)===b.c){setTimeout(function(){state.xp=(state.xp||0)+50;saveLocal();renderAll();celebrate("\uD83D\uDCD6",b.n+"\u3000\u5b8c\u8aad\uff01","\u7d20\u6674\u3089\u3057\u3044\uff01 +50\u30dc\u30fc\u30ca\u30b9XP \uD83C\uDF89");},300);}checkNewBadges();await saveToDb();}
async function markAllChaps(){var b=activeBook;if(!state.read)state.read={};var before=bookRead(state,b);state.read[b.n]=new Array(b.c).fill(true);var gained=(b.c-before)*10;state.xp=(state.xp||0)+gained+50;state.todayChaps=(state.todayChaps||0)+(b.c-before);state.todayXp=(state.todayXp||0)+gained;var today=todayStr();if(state.lastDate!==today&&b.c>before){var prev=new Date();prev.setDate(prev.getDate()-1);var yesterday=prev.toISOString().slice(0,10);state.streak=(state.lastDate===yesterday)?(state.streak||0)+1:1;state.lastDate=today;}saveLocal();renderChaps();renderAll();$("modal-info").textContent="\uD83D\uDCDB "+b.c+" / "+b.c+" \u7ae0\u3000\u2B50 1\u7ae0 = 10 XP";if(before<b.c)celebrate("\uD83C\uDF89",b.n+"\u3000\u5b8c\u8aad\uff01","+"+(gained+50)+" XP\u7372\u5f97\uff01 \uD83D\uDD25");checkNewBadges();await saveToDb();}

function celebrate(icon,title,sub){if(celebrateTimer)clearTimeout(celebrateTimer);$("cel-icon").textContent=icon;$("cel-title").textContent=title;$("cel-sub").textContent=sub;var cel=$("celebrate"),bub=$("celebrate-bubble");cel.style.display="flex";cel.querySelectorAll(".confetti").forEach(function(c){c.remove();});var colors=["#58CC02","#FFD900","#1CB0F6","#FF4B4B","#CE82FF","#FF9600"];for(var i=0;i<24;i++){var c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"%";c.style.top="-20px";c.style.background=colors[Math.floor(Math.random()*colors.length)];c.style.animationDelay=Math.random()*0.5+"s";c.style.width=(Math.random()*10+6)+"px";c.style.height=(Math.random()*10+6)+"px";cel.appendChild(c);}setTimeout(function(){bub.classList.add("show");},10);celebrateTimer=setTimeout(hideCelebrate,3500);}
